name: image

# 构建 builder 镜像并发布到 GHCR:
#   push main      -> :latest  :sha-<short>        (+ -jammy 变体)
#   tag vX.Y.Z     -> :vX.Y.Z  :X.Y.Z  :X.Y        (+ -jammy 变体)
#   pull_request   -> 只构建 + 冒烟, 不推送
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/younglark/autoinstall-iso-builder

jobs:
  # ---------------------------------------------------------------------------
  # Linux: 真跑容器。构建 amd64 镜像 -> 经 scripts/aib.sh 用假 ISO 端到端 build -> check-iso
  # ---------------------------------------------------------------------------
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autoinstall-iso-builder:ci
          build-args: |
            AIB_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=noble
          cache-to: type=gha,scope=noble,mode=max

      - name: help / version / local-check (inside container, non-root via AIB_UID)
        env:
          AIB_IMAGE: autoinstall-iso-builder
          AIB_TAG: ci
        run: |
          scripts/aib.sh help
          test "$(scripts/aib.sh version)" = "ci-${{ github.sha }}"
          scripts/aib.sh local-check
          scripts/aib.sh fetch-offline --help >/dev/null

      - name: E2E build with fake ISO via aib.sh (server + desktop, ISO outside cwd)
        env:
          AIB_IMAGE: autoinstall-iso-builder
          AIB_TAG: ci
        run: |
          set -euo pipefail
          isodir="$RUNNER_TEMP/isos"
          mkdir -p "$isodir" work
          cd work
          for e in server desktop; do
            # 假 ISO 也在容器里做 (宿主机无需 xorriso)
            ../scripts/aib.sh shell -c "bash /opt/aib/test/make-fake-iso.sh $e /work/fake-$e.iso"
            mv "fake-$e.iso" "$isodir/"
            ../scripts/aib.sh build --iso "$isodir/fake-$e.iso" --out "out/$e.iso" \
              --hostname ci-$e --password-hash "$(openssl passwd -6 ci)" \
              --ssh-authorized-keys ../test/fixtures/authorized_keys --auto-disk
            test -s "out/$e.iso"
            # Linux 上产出属主应为当前用户 (而非 root)
            test "$(stat -c %u "out/$e.iso")" = "$(id -u)"
            ../scripts/aib.sh check-iso "out/$e.iso"
          done
          ls -la out

      - name: fetch-offline direct mode guard (release mismatch must fail fast, no network)
        run: |
          set +e
          out="$(docker run --rm autoinstall-iso-builder:ci fetch-offline --release jammy --out /tmp/b 2>&1)"
          rc=$?
          echo "$out"
          test "$rc" -ne 0 && echo "$out" | grep -q 'direct 模式要求容器发行版与 --release 一致'

  # ---------------------------------------------------------------------------
  # 三平台包装脚本: 只测参数/路径改写 (--dry-run, 不需要 docker)。
  # GitHub macOS runner 没有 docker; Windows runner 只有 Windows containers,
  # 所以这里不跑真容器——真容器端到端只在 Linux job 里覆盖。
  # ---------------------------------------------------------------------------
  wrappers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: aib.sh dry-run (bash; macOS uses stock /bin/bash 3.2)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash --version | head -1
          /bin/bash test/wrapper-dry-run.sh

      - name: aib.ps1 dry-run (pwsh 7)
        shell: pwsh
        run: ./test/wrapper-dry-run.ps1

      - name: aib.ps1 dry-run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/wrapper-dry-run.ps1

  # ---------------------------------------------------------------------------
  # 多架构构建 + 推送 GHCR (PR 只构建不推送)
  # ---------------------------------------------------------------------------
  publish:
    needs: [container-smoke, wrappers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            ubuntu: "24.04"
            suffix: ""
          - variant: jammy
            ubuntu: "22.04"
            suffix: "-jammy"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            AIB_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}-multi
          cache-to: type=gha,scope=${{ matrix.variant }}-multi,mode=max
