name: ci

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml openssl

      - name: ShellCheck
        run: |
          shellcheck -x build-iso.sh software/run-all.sh software/*.sh test/local-check.sh
          # SC2054: qemu -drive file=...,if=... commas are inside one argv, not array separators
          shellcheck -e SC2054,SC2001 -x test/qemu-smoke.sh

      - name: Python syntax
        run: python3 -m py_compile tools/patch-grub.py tools/render-user-data.py

      - name: Local validators (render / grub / skip / yaml)
        run: bash test/local-check.sh

      # 完整 build-iso --dry-run 需要真实 Ubuntu ISO, CI 不下载 (~2GB)。
      # 组件级校验已覆盖渲染与 grub 注入。
